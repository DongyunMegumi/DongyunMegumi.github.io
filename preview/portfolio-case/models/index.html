<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>模型总览 | 東雲 Megumi</title>
    <link rel="stylesheet" href="/home/style.css" />
    <link rel="stylesheet" href="/home/brand.css" />
    <link rel="stylesheet" href="/characters/character-cards.css" />
    <link rel="stylesheet" href="/models/style.css" />
    <link rel="stylesheet" href="/home/type.css" />
    <script src="/characters/assets/vendor/lucide.min.js" defer></script>
    <script type="module" src="/models/models.js"></script>
  </head>
  <body class="models-page">
    <a class="skip-link" href="#collection">跳到模型作品</a>
    <header class="site-header">
      <a class="brand-logo" href="/" aria-label="東雲 Megumi 首页"
        ><img
          class="brand-image"
          data-brand="dark"
          src="/home/assets/brand.png"
          alt="東雲 Megumi"
          width="2076"
          height="758"
      /></a>
      <nav aria-label="模型导航">
        <a href="/">首页</a><a href="/models/" aria-current="page">模型总览</a
        ><a href="/commission/"
          >委托咨询<i data-lucide="arrow-up-right" aria-hidden="true"></i
        ></a>
      </nav>
    </header>
    <main class="models-main">
      <div class="models-heading" data-scroll-reveal>
        <p class="breadcrumb"><a href="/">首页</a><span>/</span>模型总览</p>
        <div class="models-title">
          <div class="collection-title">
            <h1>Characters</h1>
            <p>模型总览</p>
          </div>
        </div>
      </div>
      <section
        id="collection"
        aria-labelledby="collectionTitle"
        data-scroll-reveal
      >
        <h2 class="visually-hidden" id="collectionTitle">角色作品</h2>
        <!-- MODEL_COLLECTION -->
        <div class="work-footnote">
          <span data-collection-total>01 VTuber / 03 游戏模型制作计划</span
          ><span data-collection-credit hidden>SUMI · 原画署名待确认</span>
        </div>
      </section>
      <section
        class="models-process"
        id="process"
        aria-labelledby="processTitle"
        data-scroll-reveal
      >
        <div>
          <span class="micro-label">TECHNICAL ARCHIVE</span>
          <h2 id="processTitle">制作档案</h2>
          <p data-process-description>Sumi / 结构与基础颜色</p>
        </div>
        <div class="process-records">
          <a class="process-entry" href="/models/sumi/?mode=compare#showcase">
            <img
              src="/home/assets/sumi-clay.png"
              alt="Sumi 灰色 MatCap 白模"
              width="900"
              height="1400"
              loading="lazy"
            />
            <div>
              <small>MATCAP / BASE COLOR</small>
              <h3>白模与贴图</h3>
              <span>查看制作对照<i data-lucide="arrow-up-right" aria-hidden="true"></i></span>
            </div>
          </a>
          <div class="process-plans" data-process-plans>
            <h3>角色资料 / 制作计划</h3>
            <a class="process-plan" href="/characters/?character=0#profile">
              <img
                src="/characters/assets/images/display/char-01-cutout.png"
                alt="" width="70" height="80" loading="lazy"
              />
              <span>
                <strong>CHARACTER 01</strong>
                <small>游戏角色 / 立绘与详情</small>
              </span>
              <i data-lucide="arrow-up-right" aria-hidden="true"></i>
            </a>
            <a class="process-plan" href="/characters/?character=1#profile">
              <img
                src="/characters/assets/images/display/char-02-cutout.png"
                alt="" width="70" height="80" loading="lazy"
              />
              <span>
                <strong>CHARACTER 02</strong>
                <small>游戏角色 / 立绘与详情</small>
              </span>
              <i data-lucide="arrow-up-right" aria-hidden="true"></i>
            </a>
            <a class="process-plan" href="/characters/?character=2#profile">
              <img
                src="/characters/assets/images/char-03.png"
                alt="" width="70" height="80" loading="lazy"
              />
              <span>
                <strong>CHARACTER 03</strong>
                <small>游戏角色 / 立绘与详情</small>
              </span>
              <i data-lucide="arrow-up-right" aria-hidden="true"></i>
            </a>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <a class="text-link" href="/"
        >返回首页<i data-lucide="arrow-up-left" aria-hidden="true"></i></a
      ><span class="micro-label">© 2026 MEGUMI</span
      ><a class="text-link" href="/commission/"
        >委托咨询<i data-lucide="arrow-up-right" aria-hidden="true"></i
      ></a>
    </footer>
  </body>
</html>
