---
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CHARACTER GALLERY | 東雲Megumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 背景氛围层 -->
  <div class="mm-ambient" aria-hidden="true">
    <div class="mm-vignette"></div>
    <div class="mm-particles" id="mmParticles"></div>
  </div>

  <!-- 顶部 -->
  <header class="mm-header">
    <h1 class="mm-logo"><span class="mm-logo-en">GALLERY</span><span class="mm-logo-sub">— Lament of Characters —</span></h1>
    <a href="/" class="mm-blog-link" title="返回博客">BLOG</a>
      <div class="mm-header-actions">
      <button class="mm-bgm-btn" id="exportDataBtn" title="导出当前角色数据为 characters-data.json，上传到 GitHub 即可发布给所有访客">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
        <span>PUBLISH</span>
      </button>
      <button class="mm-bgm-btn" id="bgmUploadBtn" title="为当前角色设置音乐">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>SET LAMENT</span>
      </button>
      <input type="file" id="bgmInput" accept="audio/*" hidden />
      <button class="mm-sound-btn" id="soundToggle" aria-pressed="false" title="音乐开关">
        <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
        <span id="soundLabel">SOUND OFF</span>
      </button>
    </div>
  </header>

  <!-- 全屏角色舞台 -->
  <main class="mm-stage" id="mmStage">
    <div class="mm-artwork" id="mmArtwork">
      <img class="mm-art-layer" id="artA" alt="" draggable="false" />
      <img class="mm-art-layer" id="artB" alt="" draggable="false" />
    </div>

    <!-- 角色信息 -->
    <section class="mm-charinfo" id="mmCharInfo">
      <p class="mm-char-romaji" id="charRomaji"></p>
      <h2 class="mm-char-name" id="charName"></h2>
      <div class="mm-char-divider" aria-hidden="true"><i></i><span>&#10022;</span><i></i></div>
      <p class="mm-char-quote" id="charQuote"></p>
      <div class="mm-media-strip" id="mediaStrip"></div>
    </section>
  </main>

  <!-- 底部角色选择栏 -->
  <nav class="mm-selector-wrap" aria-label="角色选择">
    <button class="mm-arrow mm-arrow--l" id="selArrowL" aria-label="向左">&#10094;</button>
    <div class="mm-selector" id="mmSelector"></div>
    <button class="mm-arrow mm-arrow--r" id="selArrowR" aria-label="向右">&#10095;</button>
  </nav>

  <!-- 空状态 -->
  <div class="mm-empty" id="mmEmpty" hidden>
    <p class="mm-empty-title">NO CHARACTER</p>
    <p class="mm-empty-text">尚未读取到角色数据。<br />请确认 characters-data.json / characters-data.js 与本页在同一目录，<br />或先在角色管理页（character-showcase-v2）创建角色后点 PUBLISH。</p>
  </div>

  <div class="mm-toast" id="mmToast"></div>

  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  <script src="characters-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
